<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --paper:        #FAF9F6;
  --ink:          #18181B;
  --stone:        #71717A;
  --border:       rgba(24,24,27,0.10);
  --accent:       #D97706;
  --accent-light: rgba(217,119,6,0.08);

  --teal:         #0D9488;
  --teal-light:   rgba(13,148,136,0.10);
  --red:          #DC2626;
  --red-light:    rgba(220,38,38,0.08);
  --red-border:   rgba(220,38,38,0.25);

  --surface:      #FFFFFF;
  --border-solid: #E4E4E7;

  --radius-sm:    4px;
  --radius:       8px;
  --radius-lg:    12px;
  --radius-xl:    16px;

  --shadow-sm:    0 1px 2px rgba(0,0,0,0.04);
  --shadow:       0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);

  --font-serif:   'Instrument Serif', Georgia, serif;
  --font-sans:    'Plus Jakarta Sans', system-ui, sans-serif;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--font-serif); line-height: 1.25; }

button {
  font-family: var(--font-sans);
  cursor: pointer;
  border: none;
  transition: all 0.15s ease;
}
button:disabled { opacity: 0.45; cursor: not-allowed; }

input[type="text"], input[type="number"] {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border-solid);
  border-radius: var(--radius);
  padding: 0.6rem 0.85rem;
  outline: none;
  width: 100%;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input[type="text"]:focus, input[type="number"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
input[type="text"]::placeholder { color: var(--stone); }

/* ============================================================
   LAYOUT — single-column editorial
   ============================================================ */
.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 1.5rem 4rem;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  padding: 3rem 0 2rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2.5rem;
}

.site-header h1 {
  font-size: clamp(2rem, 5vw, 2.75rem);
  color: var(--ink);
  letter-spacing: -0.02em;
  margin-bottom: 0.35rem;
}

.site-header .tagline {
  font-size: 1rem;
  color: var(--stone);
  font-style: italic;
}

.site-header .accent-dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  margin-right: 0.5rem;
  vertical-align: middle;
  position: relative;
  top: -1px;
}

/* ============================================================
   SECTION LABELS
   ============================================================ */
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--stone);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--border-solid);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
}

/* ============================================================
   SETUP SECTION
   ============================================================ */
.setup-section { margin-bottom: 2rem; }

/* Model row */
.model-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.25rem;
}

.model-field { display: flex; flex-direction: column; gap: 0.4rem; }

.model-field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--stone);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.model-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 0.15rem 0.45rem;
  border-radius: var(--radius-sm);
}
.model-tag-a {
  background: var(--teal-light);
  color: var(--teal);
}
.model-tag-b {
  background: var(--accent-light);
  color: var(--accent);
}

/* Scenarios */
.scenarios-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.6rem;
}

.pill-actions {
  display: flex;
  gap: 0.4rem;
}

.pill-action-btn {
  font-size: 11px;
  font-weight: 600;
  color: var(--stone);
  background: transparent;
  border: 1px solid var(--border-solid);
  border-radius: var(--radius-sm);
  padding: 0.2rem 0.6rem;
}
.pill-action-btn:hover { color: var(--ink); border-color: var(--ink); }

.scenario-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-bottom: 1.25rem;
  min-height: 36px;
}

.scenario-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.3rem 0.7rem;
  border-radius: var(--radius-xl);
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border-solid);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  user-select: none;
  transition: all 0.12s;
}
.scenario-pill:hover { border-color: var(--accent); }
.scenario-pill.selected {
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.scenario-pill.selected .pill-check { opacity: 1; }
.pill-check { opacity: 0; color: var(--accent); }
.scenario-pill:not(.selected) .pill-check { display: none; }

.scenarios-loading {
  font-size: 13px;
  color: var(--stone);
  font-style: italic;
  padding: 0.5rem 0;
}

/* Runs per scenario */
.runs-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.runs-row label {
  font-size: 12px;
  font-weight: 600;
  color: var(--stone);
  white-space: nowrap;
}
.runs-row input[type="number"] {
  width: 80px;
}

/* Run button */
.run-btn {
  width: 100%;
  padding: 0.85rem 1.5rem;
  font-size: 15px;
  font-weight: 700;
  background: var(--accent);
  color: white;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  letter-spacing: -0.01em;
}
.run-btn:hover:not(:disabled) {
  background: #B45309;
  box-shadow: 0 2px 12px rgba(217,119,6,0.35);
}
.run-btn:active:not(:disabled) { transform: translateY(1px); }

/* ============================================================
   PROGRESS SECTION
   ============================================================ */
.progress-section {
  display: none;
  margin-bottom: 2rem;
}
.progress-section.visible { display: block; }

.progress-inner {
  text-align: center;
  padding: 2.5rem 1.5rem 2rem;
}

.progress-scenario-text {
  font-family: var(--font-serif);
  font-size: 1.4rem;
  color: var(--ink);
  margin-bottom: 0.5rem;
  min-height: 2rem;
}

.progress-elapsed {
  font-size: 12px;
  color: var(--stone);
  margin-bottom: 1.25rem;
}

.progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}

/* ============================================================
   RESULTS SECTION
   ============================================================ */
.results-section {
  display: none;
  margin-bottom: 2rem;
}
.results-section.visible { display: block; }

/* Winner banner */
.winner-banner {
  margin-bottom: 2rem;
  padding: 1.25rem 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border-solid);
  border-radius: var(--radius-lg);
  border-left: 4px solid var(--accent);
}
.winner-banner h2 {
  font-size: 1.5rem;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin-bottom: 0.2rem;
}
.winner-banner .winner-sub {
  font-size: 13px;
  color: var(--stone);
}

/* Rubric comparison */
.rubric-section { margin-bottom: 2rem; }

.rubric-row {
  padding: 1rem 0;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 130px 1fr auto;
  gap: 1rem;
  align-items: center;
}
.rubric-row:last-child { border-bottom: none; }

.rubric-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.rubric-winner-tag {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.1rem 0.4rem;
  border-radius: var(--radius-sm);
  margin-top: 2px;
}
.rubric-winner-a { background: var(--teal-light); color: var(--teal); }
.rubric-winner-b { background: var(--accent-light); color: var(--accent); }
.rubric-winner-tie { background: rgba(113,113,122,0.08); color: var(--stone); }

.rubric-bars { display: flex; flex-direction: column; gap: 0.5rem; }

.bar-line {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 11px;
}
.bar-model-label {
  width: 20px;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--stone);
  flex-shrink: 0;
}
.bar-track {
  flex: 1;
  height: 7px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}
.bar-fill-a { background: var(--teal); }
.bar-fill-b { background: var(--accent); }
.bar-score {
  font-size: 12px;
  font-weight: 700;
  width: 30px;
  text-align: right;
  flex-shrink: 0;
}
.bar-score-a { color: var(--teal); }
.bar-score-b { color: var(--accent); }

/* Regressions alert */
.regression-alert {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  padding: 1rem 1.25rem;
  border: 1px solid var(--red-border);
  background: var(--red-light);
  border-radius: var(--radius);
  margin-bottom: 0.6rem;
}
.regression-alert-icon { color: var(--red); flex-shrink: 0; margin-top: 1px; }
.regression-alert-text { font-size: 13px; color: var(--ink); line-height: 1.5; }
.regression-alert-text strong { color: var(--red); }

/* Raw results table */
.raw-table-section { margin-bottom: 2rem; }

.results-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.results-table th {
  text-align: left;
  padding: 0.55rem 0.75rem;
  border-bottom: 2px solid var(--border-solid);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--stone);
}
.results-table td {
  padding: 0.6rem 0.75rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.results-table tr:last-child td { border-bottom: none; }
.results-table tr:hover td { background: rgba(0,0,0,0.015); }

.winner-cell-a { color: var(--teal); font-weight: 600; }
.winner-cell-b { color: var(--accent); font-weight: 600; }
.winner-cell-tie { color: var(--stone); }

/* ============================================================
   LEADERBOARD
   ============================================================ */
.leaderboard-section { margin-bottom: 2rem; }

.lb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.lb-table th {
  text-align: left;
  padding: 0.55rem 0.75rem;
  border-bottom: 2px solid var(--border-solid);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--stone);
}
.lb-table td {
  padding: 0.65rem 0.75rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.lb-table tr:last-child td { border-bottom: none; }
.lb-table tr:hover td { background: rgba(0,0,0,0.015); }

.lb-rank {
  font-weight: 700;
  color: var(--stone);
  font-size: 13px;
  width: 36px;
}
.lb-rank-1 { color: var(--accent); }
.lb-model { font-weight: 600; }
.lb-score { font-weight: 700; font-size: 1.05rem; color: var(--accent); }
.lb-runs { color: var(--stone); }
.lb-best { color: var(--teal); font-size: 12px; }
.lb-worst { color: var(--stone); font-size: 12px; }

.lb-empty {
  text-align: center;
  padding: 2.5rem 1rem;
  color: var(--stone);
  font-style: italic;
  font-size: 14px;
}

/* ============================================================
   UTILITIES
   ============================================================ */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  flex-shrink: 0;
}

/* Toast */
.toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  z-index: 999;
}
.toast {
  background: var(--ink);
  color: white;
  padding: 0.65rem 1rem;
  border-radius: var(--radius);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  box-shadow: var(--shadow);
  max-width: 320px;
  animation: toast-in 0.2s ease;
}
@keyframes toast-in {
  from { transform: translateY(8px); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}
.toast.error   { background: var(--red); }
.toast.success { background: var(--teal); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-solid); border-radius: 99px; }

/* Responsive */
@media (max-width: 560px) {
  .model-row { grid-template-columns: 1fr; }
  .rubric-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="page">

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header class="site-header">
    <h1><span class="accent-dot"></span>Eval Harness</h1>
    <p class="tagline">LLM-as-a-Judge scoring. No vibes, just rubrics.</p>
  </header>

  <!-- ============================================================
       EVALUATION SETUP
  ============================================================ -->
  <section class="setup-section">
    <div class="section-label">
      <i data-lucide="settings-2" style="width:12px;height:12px"></i>
      Evaluation Setup
    </div>

    <div class="card">

      <!-- Model inputs -->
      <div class="model-row">
        <div class="model-field">
          <label>
            <span class="model-tag model-tag-a">Model A</span>
            Baseline
          </label>
          <input type="text" id="model-a-input" value="gpt-4o" placeholder="e.g. gpt-4o">
        </div>
        <div class="model-field">
          <label>
            <span class="model-tag model-tag-b">Model B</span>
            Challenger
          </label>
          <input type="text" id="model-b-input" value="gpt-3.5-turbo" placeholder="e.g. gpt-3.5-turbo">
        </div>
      </div>

      <!-- Scenarios -->
      <div class="scenarios-header">
        <div style="font-size:12px;font-weight:600;color:var(--stone)">
          Scenarios &mdash; <span id="selected-count">0</span> of <span id="total-count">0</span> selected
        </div>
        <div class="pill-actions">
          <button class="pill-action-btn" onclick="selectAll()">All</button>
          <button class="pill-action-btn" onclick="selectNone()">None</button>
        </div>
      </div>
      <div class="scenario-pills" id="scenario-pills">
        <span class="scenarios-loading">Loading scenarios&hellip;</span>
      </div>

      <!-- N runs -->
      <div class="runs-row">
        <label for="n-runs-input">Runs per scenario</label>
        <input type="number" id="n-runs-input" value="1" min="1" max="20" style="width:80px">
      </div>

      <!-- Run button -->
      <button class="run-btn" id="run-btn" onclick="startRun()" disabled>
        <i data-lucide="play" style="width:16px;height:16px"></i>
        Run Evaluation
      </button>
    </div>
  </section>

  <!-- ============================================================
       PROGRESS
  ============================================================ -->
  <section class="progress-section" id="progress-section">
    <div class="section-label">
      <i data-lucide="loader-2" style="width:12px;height:12px"></i>
      In Progress
    </div>
    <div class="card">
      <div class="progress-inner">
        <div class="progress-scenario-text" id="progress-text">Queued&hellip;</div>
        <div class="progress-elapsed" id="progress-elapsed">0s elapsed</div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       RESULTS
  ============================================================ -->
  <section class="results-section" id="results-section">

    <!-- Winner banner -->
    <div class="winner-banner" id="winner-banner">
      <h2 id="winner-headline">Results</h2>
      <div class="winner-sub" id="winner-sub"></div>
    </div>

    <!-- Score comparison -->
    <div class="section-label">
      <i data-lucide="bar-chart-3" style="width:12px;height:12px"></i>
      Rubric Scores
    </div>
    <div class="card rubric-section" id="rubric-comparison">
      <!-- Populated by JS -->
    </div>

    <!-- Regressions -->
    <div id="regressions-area" style="margin-bottom:2rem"></div>

    <!-- Raw results table -->
    <div class="raw-table-section">
      <div class="section-label">
        <i data-lucide="table-2" style="width:12px;height:12px"></i>
        Scenario Results
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <table class="results-table" id="results-table">
          <thead>
            <tr>
              <th>Scenario</th>
              <th>Model A</th>
              <th>Model B</th>
              <th>Winner</th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>

  </section>

  <!-- ============================================================
       LEADERBOARD
  ============================================================ -->
  <section class="leaderboard-section">
    <div class="section-label">
      <i data-lucide="trophy" style="width:12px;height:12px"></i>
      Leaderboard
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div id="leaderboard-inner">
        <div class="lb-empty">Run your first evaluation to populate the leaderboard.</div>
      </div>
    </div>
  </section>

</div><!-- /.page -->

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<!-- ============================================================
     JAVASCRIPT
============================================================ -->
<script>
lucide.createIcons();

// ===================================================================
// STATE
// ===================================================================
const API = '';
let currentRunId   = null;
let pollInterval   = null;
let elapsedTimer   = null;
let elapsedSeconds = 0;
let allScenarios   = [];
let selectedScenarios = new Set();
let lastResults    = null;

// ===================================================================
// INIT
// ===================================================================
document.addEventListener('DOMContentLoaded', () => {
  loadScenarios();
  loadLeaderboard();
});

// ===================================================================
// SCENARIOS
// ===================================================================
async function loadScenarios() {
  try {
    const res  = await fetch(`${API}/api/scenarios`);
    const data = await res.json();
    allScenarios = data.scenarios || [];

    // Default: all selected
    allScenarios.forEach(sc => selectedScenarios.add(sc.id));

    renderScenarioPills();
    document.getElementById('run-btn').disabled = false;
  } catch (e) {
    document.getElementById('scenario-pills').innerHTML =
      '<span style="font-size:13px;color:var(--stone)">Could not load scenarios &mdash; is the server running?</span>';
  }
}

function renderScenarioPills() {
  const container = document.getElementById('scenario-pills');
  if (allScenarios.length === 0) {
    container.innerHTML = '<span style="font-size:13px;color:var(--stone);font-style:italic">No scenarios found.</span>';
    updateCounts();
    return;
  }

  container.innerHTML = allScenarios.map(sc => {
    const active = selectedScenarios.has(sc.id) ? 'selected' : '';
    const label  = sc.name || sc.id;
    return `<button class="scenario-pill ${active}" onclick="toggleScenario('${sc.id}', this)" title="${escapeHtml(sc.id)}">
      <i data-lucide="check" class="pill-check" style="width:11px;height:11px"></i>
      ${escapeHtml(label)}
    </button>`;
  }).join('');

  lucide.createIcons();
  updateCounts();
}

function toggleScenario(id, el) {
  if (selectedScenarios.has(id)) {
    selectedScenarios.delete(id);
    el.classList.remove('selected');
  } else {
    selectedScenarios.add(id);
    el.classList.add('selected');
  }
  updateCounts();
  lucide.createIcons();
}

function selectAll() {
  allScenarios.forEach(sc => selectedScenarios.add(sc.id));
  renderScenarioPills();
}

function selectNone() {
  selectedScenarios.clear();
  renderScenarioPills();
}

function updateCounts() {
  document.getElementById('selected-count').textContent = selectedScenarios.size;
  document.getElementById('total-count').textContent    = allScenarios.length;
}

// ===================================================================
// RUN EVALUATION
// ===================================================================
async function startRun() {
  const modelA     = document.getElementById('model-a-input').value.trim() || 'gpt-4o';
  const modelB     = document.getElementById('model-b-input').value.trim() || 'gpt-3.5-turbo';
  const nRuns      = parseInt(document.getElementById('n-runs-input').value) || 1;
  const scenarioIds = [...selectedScenarios];

  if (scenarioIds.length === 0) {
    toast('Select at least one scenario to evaluate.', 'error');
    return;
  }

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Starting&hellip;';

  // Hide previous results
  document.getElementById('results-section').classList.remove('visible');
  document.getElementById('progress-section').classList.add('visible');

  // Reset elapsed timer
  elapsedSeconds = 0;
  clearInterval(elapsedTimer);
  updateElapsed();
  elapsedTimer = setInterval(() => {
    elapsedSeconds++;
    updateElapsed();
  }, 1000);

  try {
    const res  = await fetch(`${API}/api/eval/run`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ model_a: modelA, model_b: modelB, scenario_ids: scenarioIds, n_runs: nRuns }),
    });
    const data = await res.json();
    currentRunId = data.run_id;

    pollInterval = setInterval(pollStatus, 1500);
    toast('Evaluation started.', 'success');

  } catch (e) {
    toast('Failed to start: ' + e.message, 'error');
    resetRunBtn();
    document.getElementById('progress-section').classList.remove('visible');
  }
}

function updateElapsed() {
  const m = Math.floor(elapsedSeconds / 60);
  const s = elapsedSeconds % 60;
  const label = m > 0 ? `${m}m ${s}s elapsed` : `${s}s elapsed`;
  document.getElementById('progress-elapsed').textContent = label;
}

async function pollStatus() {
  if (!currentRunId) return;
  try {
    const res    = await fetch(`${API}/api/eval/${currentRunId}/status`);
    const status = await res.json();

    const pct = status.progress || 0;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = status.message || 'Running\u2026';

    if (status.status === 'complete') {
      clearInterval(pollInterval);
      clearInterval(elapsedTimer);
      await loadResults();
      resetRunBtn();

    } else if (status.status === 'error') {
      clearInterval(pollInterval);
      clearInterval(elapsedTimer);
      toast('Evaluation error: ' + (status.message || 'unknown'), 'error');
      document.getElementById('progress-section').classList.remove('visible');
      resetRunBtn();
    }
  } catch (_) { /* keep polling on network hiccup */ }
}

function resetRunBtn() {
  const btn = document.getElementById('run-btn');
  btn.disabled = false;
  btn.innerHTML = '<i data-lucide="play" style="width:16px;height:16px"></i> Run Evaluation';
  lucide.createIcons();
}

// ===================================================================
// LOAD & RENDER RESULTS
// ===================================================================
async function loadResults() {
  try {
    const res  = await fetch(`${API}/api/eval/${currentRunId}/results`);
    const data = await res.json();
    lastResults = data;

    document.getElementById('progress-section').classList.remove('visible');
    document.getElementById('results-section').classList.add('visible');

    renderWinnerBanner(data);
    renderRubricComparison(data);
    renderRegressions(data);
    renderRawTable(data);
    loadLeaderboard();

  } catch (e) {
    toast('Could not load results: ' + e.message, 'error');
    document.getElementById('progress-section').classList.remove('visible');
  }
}

// -----------------------------------------------------------------------
// WINNER BANNER
// -----------------------------------------------------------------------
function renderWinnerBanner(data) {
  const { summary } = data;
  const modelA = data.model_a;
  const modelB = data.model_b;
  const mA = summary?.models?.[modelA];
  const mB = summary?.models?.[modelB];

  if (!mA || !mB) {
    document.getElementById('winner-headline').textContent = 'Results';
    document.getElementById('winner-sub').textContent = '';
    return;
  }

  const rubrics   = Object.keys(mA.rubrics || {});
  let aWins = 0, bWins = 0, ties = 0;

  rubrics.forEach(r => {
    const ra = mA.rubrics[r]?.mean || 0;
    const rb = mB.rubrics[r]?.mean || 0;
    if (ra > rb + 0.05) aWins++;
    else if (rb > ra + 0.05) bWins++;
    else ties++;
  });

  const totalRubrics = rubrics.length;
  let headline = '';
  let sub = '';

  if (aWins > bWins) {
    headline = `${modelA} leads on ${aWins}/${totalRubrics} rubric${aWins !== 1 ? 's' : ''}`;
    const topRubric = findBestDeltaRubric(mA, mB);
    if (topRubric) {
      sub = `${modelA} edges ahead on ${topRubric}`;
    }
  } else if (bWins > aWins) {
    headline = `${modelB} leads on ${bWins}/${totalRubrics} rubric${bWins !== 1 ? 's' : ''}`;
    const topRubric = findBestDeltaRubric(mB, mA);
    if (topRubric) {
      sub = `${modelB} edges ahead on ${topRubric}`;
    }
  } else {
    const drawRubrics = rubrics.filter(r => {
      const ra = mA.rubrics[r]?.mean || 0;
      const rb = mB.rubrics[r]?.mean || 0;
      return Math.abs(ra - rb) <= 0.05;
    });
    if (drawRubrics.length === totalRubrics) {
      headline = `Draw across all ${totalRubrics} rubric${totalRubrics !== 1 ? 's' : ''}`;
    } else {
      headline = `Draw on ${drawRubrics.map(r => r.replace(/_/g, ' ')).join(' and ')}`;
    }
    sub = 'Models are statistically equivalent on these rubrics';
  }

  document.getElementById('winner-headline').textContent = headline;
  document.getElementById('winner-sub').textContent      = sub;
}

function findBestDeltaRubric(winner, loser) {
  const rubrics = Object.keys(winner.rubrics || {});
  let best = null, bestDelta = 0;
  rubrics.forEach(r => {
    const delta = (winner.rubrics[r]?.mean || 0) - (loser.rubrics[r]?.mean || 0);
    if (delta > bestDelta) { bestDelta = delta; best = r; }
  });
  return best ? best.replace(/_/g, ' ') : null;
}

// -----------------------------------------------------------------------
// RUBRIC COMPARISON BARS
// -----------------------------------------------------------------------
const RUBRIC_DISPLAY = {
  faithfulness:   'Faithfulness',
  relevance:      'Relevance',
  coherence:      'Coherence',
  completeness:   'Completeness',
};

function rubricLabel(r) {
  return RUBRIC_DISPLAY[r] || r.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function renderRubricComparison(data) {
  const { summary } = data;
  const modelA = data.model_a;
  const modelB = data.model_b;
  const mA = summary?.models?.[modelA];
  const mB = summary?.models?.[modelB];
  const container = document.getElementById('rubric-comparison');

  if (!mA || !mB) {
    container.innerHTML = '<div style="color:var(--stone);font-size:13px;padding:0.5rem">No rubric data available.</div>';
    return;
  }

  const rubrics = [...new Set([...Object.keys(mA.rubrics || {}), ...Object.keys(mB.rubrics || {})])];

  const preferred = ['faithfulness', 'relevance', 'coherence', 'completeness'];
  rubrics.sort((a, b) => {
    const ia = preferred.indexOf(a);
    const ib = preferred.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });

  container.innerHTML = rubrics.map(r => {
    const ra = mA.rubrics[r]?.mean || 0;
    const rb = mB.rubrics[r]?.mean || 0;
    const pctA = Math.min(100, (ra / 10) * 100).toFixed(1);
    const pctB = Math.min(100, (rb / 10) * 100).toFixed(1);

    let winnerTag = '';
    let winnerClass = '';
    if (ra > rb + 0.05) {
      winnerTag   = modelA;
      winnerClass = 'rubric-winner-a';
    } else if (rb > ra + 0.05) {
      winnerTag   = modelB;
      winnerClass = 'rubric-winner-b';
    } else {
      winnerTag   = 'Tie';
      winnerClass = 'rubric-winner-tie';
    }

    return `<div class="rubric-row">
      <div>
        <div class="rubric-name">${rubricLabel(r)}</div>
        <div class="rubric-winner-tag ${winnerClass}">${escapeHtml(winnerTag)}</div>
      </div>
      <div class="rubric-bars">
        <div class="bar-line">
          <div class="bar-model-label">A</div>
          <div class="bar-track"><div class="bar-fill bar-fill-a" style="width:${pctA}%"></div></div>
          <div class="bar-score bar-score-a">${ra.toFixed(1)}</div>
        </div>
        <div class="bar-line">
          <div class="bar-model-label">B</div>
          <div class="bar-track"><div class="bar-fill bar-fill-b" style="width:${pctB}%"></div></div>
          <div class="bar-score bar-score-b">${rb.toFixed(1)}</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--stone);text-align:right;white-space:nowrap">
        /10
      </div>
    </div>`;
  }).join('');
}

// -----------------------------------------------------------------------
// REGRESSIONS
// -----------------------------------------------------------------------
function renderRegressions(data) {
  const regressions = data.regressions || [];
  const area = document.getElementById('regressions-area');

  if (regressions.length === 0) {
    area.innerHTML = '';
    return;
  }

  area.innerHTML = `
    <div class="section-label">
      <i data-lucide="alert-triangle" style="width:12px;height:12px"></i>
      Regressions Detected
    </div>
    ${regressions.map(reg => {
      const rubric  = reg.rubric?.replace(/_/g, ' ') || 'unknown rubric';
      const delta   = Math.abs(reg.delta || 0).toFixed(2);
      const modelB  = data.model_b;
      return `<div class="regression-alert">
        <div class="regression-alert-icon"><i data-lucide="alert-circle" style="width:16px;height:16px"></i></div>
        <div class="regression-alert-text">
          <strong>${escapeHtml(modelB)}</strong> scores <strong>${delta} points lower</strong> on ${rubric} &mdash; potential regression.
        </div>
      </div>`;
    }).join('')}
  `;
  lucide.createIcons();
}

// -----------------------------------------------------------------------
// RAW RESULTS TABLE
// -----------------------------------------------------------------------
function renderRawTable(data) {
  const modelA   = data.model_a;
  const modelB   = data.model_b;
  const resultsA = data.results_a || [];
  const resultsB = data.results_b || [];

  const scenarioIds = [...new Set([...resultsA.map(r => r.scenario_id), ...resultsB.map(r => r.scenario_id)])];

  document.getElementById('results-tbody').innerHTML = scenarioIds.map(sid => {
    const rA    = resultsA.find(r => r.scenario_id === sid);
    const rB    = resultsB.find(r => r.scenario_id === sid);
    const sA    = rA?.weighted_total ?? rA?.avg_score ?? null;
    const sB    = rB?.weighted_total ?? rB?.avg_score ?? null;

    let winnerText = '&mdash;';
    let winnerClass = 'winner-cell-tie';
    if (sA !== null && sB !== null) {
      if (sA > sB + 0.05)       { winnerText = escapeHtml(modelA); winnerClass = 'winner-cell-a'; }
      else if (sB > sA + 0.05)  { winnerText = escapeHtml(modelB); winnerClass = 'winner-cell-b'; }
      else                       { winnerText = 'Tie'; }
    }

    return `<tr>
      <td style="font-family:monospace;font-size:12px">${escapeHtml(sid)}</td>
      <td style="color:var(--teal);font-weight:600">${sA !== null ? sA.toFixed(2) : '&mdash;'}</td>
      <td style="color:var(--accent);font-weight:600">${sB !== null ? sB.toFixed(2) : '&mdash;'}</td>
      <td class="${winnerClass}">${winnerText}</td>
    </tr>`;
  }).join('');
}

// ===================================================================
// LEADERBOARD
// ===================================================================
async function loadLeaderboard() {
  try {
    const res     = await fetch(`${API}/api/leaderboard`);
    const data    = await res.json();
    const entries = data.leaderboard || [];
    const inner   = document.getElementById('leaderboard-inner');

    if (entries.length === 0) {
      inner.innerHTML = '<div class="lb-empty">Run your first evaluation to populate the leaderboard.</div>';
      return;
    }

    inner.innerHTML = `
      <table class="lb-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Model</th>
            <th>Avg Score</th>
            <th>Runs</th>
            <th>Best Rubric</th>
            <th>Worst Rubric</th>
          </tr>
        </thead>
        <tbody>
          ${entries.map((e, i) => {
            const rankClass = i === 0 ? 'lb-rank lb-rank-1' : 'lb-rank';
            const medal = ['1st', '2nd', '3rd'][i] || `${i + 1}th`;
            return `<tr>
              <td class="${rankClass}">${medal}</td>
              <td class="lb-model">${escapeHtml(e.model)}</td>
              <td class="lb-score">${(e.avg_weighted_total || e.avg_score || 0).toFixed(2)}</td>
              <td class="lb-runs">${e.runs_evaluated ?? e.runs ?? '&mdash;'}</td>
              <td class="lb-best">${(e.top_rubric || e.best_rubric || '&mdash;').replace(/_/g, ' ')}</td>
              <td class="lb-worst">${(e.worst_rubric || '&mdash;').replace(/_/g, ' ')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  } catch (_) { /* server not ready */ }
}

// ===================================================================
// UTILITIES
// ===================================================================
function toast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
